<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>SP・PC比較｜装着ギャラリー</title>
  <link rel="stylesheet" href="/preview.css">
  <script type="module" src="/preview.js"></script>
</head>
<body>
  <header class="preview-header">
    <h1>装着ギャラリー <span>SP・PC比較</span></h1>
    <nav aria-label="両方の画面を移動">
      <button type="button" data-section="top">ヒーロー</button>
      <button type="button" data-section="inspiration">写真で見比べる</button>
      <button type="button" data-section="finder">絞り込み</button>
      <button type="button" data-section="photoResults">写真一覧</button>
      <button type="button" data-section="ownerStories">愛車との時間</button>
      <button type="button" id="reload">再読み込み ↻</button>
    </nav>
    <a href="/" target="_blank" rel="noopener">通常表示 ↗</a>
  </header>
  <main class="preview-pair">
    <section class="device" aria-labelledby="sp-title">
      <header class="device-heading"><h2 id="sp-title">SP <span>390px</span></h2><span>スマートフォン</span></header>
      <div class="device-stage" data-width="390">
        <iframe src="/" title="スマートフォン版・幅390px" allow="autoplay; fullscreen"></iframe>
      </div>
    </section>
    <section class="device" aria-labelledby="pc-title">
      <header class="device-heading"><h2 id="pc-title">PC <span>1440px</span></h2><span>パソコン</span></header>
      <div class="device-stage" data-width="1440">
        <iframe src="/" title="PC版・幅1440px" allow="autoplay; fullscreen"></iframe>
      </div>
    </section>
  </main>
  <footer>それぞれの画面でスクロール・絞り込みを操作できます。</footer>
</body>
</html>
